# Scoped project instead of "default": this repo can only deploy into the
# nginx namespace of the local cluster, and cannot create cluster-scoped
# objects other than its own Namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sample-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Sample workloads from argocd-terraform
  sourceRepos:
    - https://github.com/OkiriGabriel/argocd-terraform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: nginx
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
